
    # --- Vending Machine portfolio demo -------------------------------------
    # sslip.io is a free wildcard DNS service: <anything>.<ip>.sslip.io
    # resolves to that IP, so no domain purchase or DNS record is needed.
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream vending_app {
        zone vending_app 64k;
        server vending-app:80 resolve;
    }

    server {
        listen 80;
        server_name vending.54.255.218.215.sslip.io;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name vending.54.255.218.215.sslip.io;

        ssl_certificate     /etc/letsencrypt/live/vending.54.255.218.215.sslip.io/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/vending.54.255.218.215.sslip.io/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:VendingTLS:10m;
        ssl_session_timeout 10m;

        client_max_body_size 8M;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location / {
            proxy_pass http://vending_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }
    }
